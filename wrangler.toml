name = "jg-nav"
pages_build_output_dir = "cf"
compatibility_date = "2024-12-01"

# D1 数据库绑定
# 部署前需要先创建 D1 数据库：npx wrangler d1 create jg-nav-db
# 然后将返回的 database_id 填入下方
[[d1_databases]]
binding = "DB"
database_name = "jg-nav-db"
database_id = "<创建后填入>"

# 环境变量
[vars]
STATIC_PASSWORD = "123456"
