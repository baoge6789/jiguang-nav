<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>目录树 - 极光导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc;
            color: #334155;
            min-height: 100vh;
            padding: 20px;
        }

        body.dark {
            background: #0b1121;
            color: #e2e8f0;
        }

        /* 顶部栏 */
        .topbar {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .topbar h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        body.dark .btn {
            background: #1a1d27;
            border-color: #2d313e;
            color: #cbd5e1;
        }

        body.dark .btn:hover {
            background: #252936;
        }

        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        /* 内容容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        body.dark .container {
            background: #1a1d27;
            border-color: #2d313e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 12px;
            border: 3px solid #e2e8f0;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        body.dark .spinner {
            border-color: #2d313e;
            border-top-color: #818cf8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 分类块 */
        .category-block {
            margin-bottom: 24px;
        }

        .category-block:last-child {
            margin-bottom: 0;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .category-title .dot {
            width: 4px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .category-title h3 {
            font-size: 15px;
            font-weight: 700;
        }

        .category-title .count {
            font-size: 12px;
            opacity: 0.5;
        }

        /* 树节点 */
        .tree-list {
            border-radius: 10px;
            border: 1px solid #f1f5f9;
            padding: 6px;
        }

        body.dark .tree-list {
            border-color: #2d313e;
            background: rgba(15, 17, 23, 0.5);
        }

        .tree-node {
            user-select: none;
        }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
        }

        .tree-row:hover {
            background: #f1f5f9;
        }

        body.dark .tree-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tree-row .arrow {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0.5;
            transition: transform 0.2s;
        }

        .tree-row .arrow.expanded {
            transform: rotate(90deg);
        }

        .tree-row .arrow.placeholder {
            visibility: hidden;
        }

        .tree-row .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .tree-row .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-row .count {
            font-size: 11px;
            opacity: 0.4;
        }

        .tree-row.hidden-item {
            opacity: 0.5;
        }

        .tree-row .hidden-mark {
            font-size: 11px;
            opacity: 0.5;
        }

        .children {
            overflow: hidden;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div class="topbar">
        <h1>🌳 目录树</h1>
        <div class="actions">
            <a href="/" class="btn btn-primary">← 返回卡片模式</a>
            <button class="btn" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- 内容 -->
    <div class="container" id="container">
        <div class="loading">
            <div class="spinner"></div>
            <p>正在加载数据...</p>
        </div>
    </div>

    <script>
        // ============================================================
        // 主题
        // ============================================================
        const themeBtn = document.getElementById('themeBtn');
        const savedTheme = localStorage.getItem('aurora_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function applyTheme(dark) {
            document.body.classList.toggle('dark', dark);
            themeBtn.textContent = dark ? '☀️' : '🌙';
            localStorage.setItem('aurora_theme', dark ? 'dark' : 'light');
        }

        applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

        themeBtn.addEventListener('click', () => {
            applyTheme(!document.body.classList.contains('dark'));
        });

        // ============================================================
        // 图标映射（简化版）
        // ============================================================
        const FOLDER_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
        const FOLDER_OPEN_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
        const LINK_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

        // ============================================================
        // 转义 HTML
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        // 递归渲染树
        // ============================================================
        function renderNode(node, allSites, level) {
            const isFolder = node.type === 'folder';
            const children = allSites
                .filter(s => s.parentId === node.id)
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

            const hasChildren = isFolder && children.length > 0;
            const indent = level * 16;

            let html = '<div class="tree-node">';

            // 节点行
            html += `<div class="tree-row ${node.isHidden ? 'hidden-item' : ''}" 
                        data-id="${node.id}" 
                        data-type="${node.type || 'site'}"
                        data-url="${escapeHtml(node.url || '')}"
                        data-folder="${isFolder ? '1' : '0'}"
                        style="padding-left: ${8 + indent}px">`;

            // 箭头（只有文件夹且有子项才显示）
            if (hasChildren) {
                html += `<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
            } else {
                html += `<span class="arrow placeholder"></span>`;
            }

            // 图标
            if (isFolder) {
                html += `<span style="color:${node.color || '#6366f1'}">${FOLDER_SVG}</span>`;
            } else {
                html += `<span style="color:${node.color || '#6366f1'}">${LINK_SVG}</span>`;
            }

            // 名称
            html += `<span class="name">${escapeHtml(node.name)}</span>`;

            // 隐藏标记
            if (node.isHidden) {
                html += `<span class="hidden-mark">👁️‍🗨️</span>`;
            }

            // 子项数量
            if (hasChildren) {
                html += `<span class="count">${children.length}</span>`;
            }

            html += '</div>';

            // 子节点
            if (hasChildren) {
                html += `<div class="children" data-parent="${node.id}" style="display:none">`;
                children.forEach(child => {
                    html += renderNode(child, allSites, level + 1);
                });
                html += '</div>';
            }

            html += '</div>';
            return html;
        }

        // ============================================================
        // 渲染整个目录树
        // ============================================================
        function renderTree(sites, categories, hiddenCategories) {
            const container = document.getElementById('container');

            if (!sites || sites.length === 0) {
                container.innerHTML = '<div class="empty">暂无数据</div>';
                return;
            }

            // 简单判断是否登录（通过 localStorage）
            const isLoggedIn = localStorage.getItem('aurora_is_logged_in') === 'true';

            // 过滤隐藏
            let filteredSites = sites;
            if (!isLoggedIn) {
                filteredSites = sites.filter(s => !s.isHidden);
            }

            const visibleCategories = isLoggedIn
                ? categories
                : categories.filter(c => !hiddenCategories.includes(c));

            let html = '';

            visibleCategories.forEach(cat => {
                const rootNodes = filteredSites
                    .filter(s => s.category === cat && !s.parentId)
                    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                if (rootNodes.length === 0) return;

                const catColor = categoryColorsMap[cat] || '#6366f1';

                html += '<div class="category-block">';
                html += `<div class="category-title">
                            <span class="dot" style="background:${catColor}"></span>
                            <h3>${escapeHtml(cat)}</h3>
                            <span class="count">(${rootNodes.length})</span>
                        </div>`;
                html += '<div class="tree-list">';
                rootNodes.forEach(node => {
                    html += renderNode(node, filteredSites, 0);
                });
                html += '</div></div>';
            });

            if (!html) {
                html = '<div class="empty">暂无数据</div>';
            }

            container.innerHTML = html;

            // 绑定点击事件
            container.querySelectorAll('.tree-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isFolder = row.dataset.folder === '1';
                    const url = row.dataset.url;
                    const id = row.dataset.id;

                    if (isFolder) {
                        // 展开/收起
                        const children = row.parentElement.querySelector(`.children[data-parent="${id}"]`);
                        const arrow = row.querySelector('.arrow');
                        if (children) {
                            const isOpen = children.style.display !== 'none';
                            children.style.display = isOpen ? 'none' : 'block';
                            if (arrow) arrow.classList.toggle('expanded', !isOpen);
                        }
                    } else if (url) {
                        // 打开站点
                        window.open(url, '_blank');
                    }
                });
            });
        }

        // ============================================================
        // 获取数据
        // ============================================================
        let categoryColorsMap = {};

        async function init() {
            try {
                const res = await fetch('/api/init');
                if (!res.ok) throw new Error('API 请求失败');
                const data = await res.json();

                // 分类
                const categories = (data.categories || []).map(c => c.name);
                const hiddenCategories = (data.categories || [])
                    .filter(c => c.isHidden)
                    .map(c => c.name);

                // 分类颜色
                categoryColorsMap = {};
                (data.categories || []).forEach(c => {
                    if (c.color) categoryColorsMap[c.name] = c.color;
                });

                // 站点
                const sites = data.sites || [];

                renderTree(sites, categories, hiddenCategories);

            } catch (e) {
                console.error(e);
                document.getElementById('container').innerHTML =
                    '<div class="empty">⚠️ 加载失败：' + escapeHtml(e.message) + '</div>';
            }
        }

        init();
    </script>

</body>
</html>
