<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>目录树 - 极光导航</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGcfFwzWpsxJQbvG_o2Jl7sQ5UaSxyUapsARECaoAEFg&s" />
    
    <!-- markmap CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        body {
            background: #f8fafc;
            color: #334155;
        }

        body.dark {
            background: #0b1121;
            color: #e2e8f0;
        }

        /* 顶部栏 */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark .topbar {
            background: rgba(26, 29, 39, 0.9);
            border-bottom-color: #2d313e;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        body.dark .btn {
            background: #1a1d27;
            border-color: #2d313e;
            color: #cbd5e1;
        }

        body.dark .btn:hover {
            background: #252936;
        }

        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        /* 画布 */
        #mindmap {
            width: 100%;
            height: 100%;
            padding-top: 60px;
        }

        /* 加载状态 */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #94a3b8;
            z-index: 50;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 12px;
            border: 3px solid #e2e8f0;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        body.dark .spinner {
            border-color: #2d313e;
            border-top-color: #818cf8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 节点样式覆盖 */
        .markmap-node > circle {
            cursor: pointer;
        }

        /* 站点节点可点击 */
        .markmap-node[data-url] {
            cursor: pointer;
        }

        .markmap-node[data-url]:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div class="topbar">
        <h1>🪾 目录树</h1>
        <div class="actions">
            <a href="/" class="btn btn-primary">← 返回卡片模式</a>
            <button class="btn" id="fitBtn">🔍 适应屏幕</button>
            <button class="btn" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- 加载 -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在加载数据...</p>
    </div>

    <!-- 画布 -->
    <svg id="mindmap"></svg>

    <script>
        // ============================================================
        // 主题
        // ============================================================
        const themeBtn = document.getElementById('themeBtn');
        const savedTheme = localStorage.getItem('aurora_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function applyTheme(dark) {
            document.body.classList.toggle('dark', dark);
            themeBtn.textContent = dark ? '☀️' : '🌙';
            localStorage.setItem('aurora_theme', dark ? 'dark' : 'light');
            // 重新渲染
            if (window.__markmap && window.__markmapData) {
                renderMindmap(window.__markmapData, dark);
            }
        }

        applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

        themeBtn.addEventListener('click', () => {
            applyTheme(!document.body.classList.contains('dark'));
        });

        // ============================================================
        // 生成 markmap 数据（Markdown 格式）
        // ============================================================
        function buildMarkdown(sites, categories, hiddenCategories) {
            // 判断是否登录
            const isLoggedIn = localStorage.getItem('aurora_is_logged_in') === 'true';

            // 过滤隐藏
            let filteredSites = sites;
            if (!isLoggedIn) {
                filteredSites = sites.filter(s => !s.isHidden);
            }

            const visibleCategories = isLoggedIn
                ? categories
                : categories.filter(c => !hiddenCategories.includes(c));

            // markmap 用 markdown 生成树
            // 根节点
            let md = '# 极光导航\n';

            visibleCategories.forEach(cat => {
                const rootNodes = filteredSites
                    .filter(s => s.category === cat && !s.parentId)
                    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                if (rootNodes.length === 0) return;

                // 分类节点
                md += `## ${cat}\n`;

                // 递归渲染
                function renderNode(node, indent) {
                    const isFolder = node.type === 'folder';
                    const children = filteredSites
                        .filter(s => s.parentId === node.id)
                        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                    const prefix = ' '.repeat(indent) + '- ';
                    if (isFolder) {
                        md += `${prefix}📁 ${node.name}\n`;
                    } else {
                        // 站点用 markdown 链接格式，点击可跳转
                        md += `${prefix}[🔗 ${node.name}](${node.url})\n`;
                    }

                    if (isFolder && children.length > 0) {
                        children.forEach(child => renderNode(child, indent + 2));
                    }
                }

                rootNodes.forEach(node => renderNode(node, 0));
            });

            return md;
        }

        // ============================================================
        // 渲染导图
        // ============================================================
        let markmapInstance = null;

        function renderMindmap(mdData, isDark) {
            const svg = document.getElementById('mindmap');
            const { Markmap } = window.markmap;
            const { Transformer } = window.markmap;

            // 清空
            svg.innerHTML = '';

            // 转换 markdown
            const transformer = new Transformer();
            const { root } = transformer.transform(mdData);

            // 创建实例
            if (markmapInstance) {
                markmapInstance.destroy();
            }

            markmapInstance = Markmap.create(svg, {
                duration: 300,
                spacingHorizontal: 80,
                spacingVertical: 8,
                paddingX: 16,
                initialExpandLevel: -1, // 全部展开
                color: (node) => {
                    // 用分类颜色
                    return '#818cf8';
                },
            }, root);

            window.__markmap = markmapInstance;
            window.__markmapData = mdData;

            // 适应屏幕
            setTimeout(() => {
                markmapInstance.fit();
            }, 100);

            // 绑定点击事件（点击站点节点打开链接）
            setTimeout(() => {
                svg.querySelectorAll('.markmap-node').forEach(node => {
                    const link = node.querySelector('a');
                    if (link) {
                        node.style.cursor = 'pointer';
                        node.addEventListener('click', (e) => {
                            e.stopPropagation();
                            window.open(link.href, '_blank');
                        });
                    }
                });
            }, 500);
        }

        // ============================================================
        // 适应屏幕按钮
        // ============================================================
        document.getElementById('fitBtn').addEventListener('click', () => {
            if (markmapInstance) markmapInstance.fit();
        });

        // ============================================================
        // 获取数据
        // ============================================================
        async function init() {
            try {
                const res = await fetch('/api/init');
                if (!res.ok) throw new Error('API 请求失败');
                const data = await res.json();

                const categories = (data.categories || []).map(c => c.name);
                const hiddenCategories = (data.categories || [])
                    .filter(c => c.isHidden)
                    .map(c => c.name);

                const sites = data.sites || [];

                // 生成 markdown
                const md = buildMarkdown(sites, categories, hiddenCategories);

                // 渲染
                document.getElementById('loading').style.display = 'none';
                renderMindmap(md, document.body.classList.contains('dark'));

            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerHTML =
                    '<p>⚠️ 加载失败：' + e.message + '</p>';
            }
        }

        // 等 DOM 和 markmap 库加载完成
        window.addEventListener('load', init);
    </script>

</body>
</html>
