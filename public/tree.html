<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>目录树 - 极光导航</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGcfFwzWpsxJQbvG_o2Jl7sQ5UaSxyUapsARECaoAEFg&s" />

    <!-- markmap CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        body {
            background: #f8fafc;
            color: #334155;
        }

        body.dark {
            background: #0b1121;
            color: #e2e8f0;
        }

        /* 顶部栏 */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark .topbar {
            background: rgba(26, 29, 39, 0.9);
            border-bottom-color: #2d313e;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn:hover { background: #f1f5f9; transform: translateY(-1px); }

        body.dark .btn {
            background: #1a1d27;
            border-color: #2d313e;
            color: #cbd5e1;
        }
        body.dark .btn:hover { background: #252936; }

        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            color: #fff;
            border: none;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

        .btn-active {
            background: #eef2ff !important;
            color: #6366f1 !important;
            border-color: #c7d2fe !important;
        }
        body.dark .btn-active {
            background: rgba(99, 102, 241, 0.15) !important;
            color: #a5b4fc !important;
            border-color: rgba(99, 102, 241, 0.3) !important;
        }

        /* 画布 / 内容区 */
        .view-container {
            width: 100%;
            height: 100%;
            padding-top: 64px;
        }
        .view-container.hidden { display: none; }

        /* 思维导图 */
        #mindmap {
            width: 100%;
            height: 100%;
        }
        .markmap-node > circle { cursor: pointer; }

        /* 树形列表视图 */
        #treeview {
            overflow-y: auto;
            padding: 20px;
        }
        .tree-wrap {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        body.dark .tree-wrap {
            background: #1a1d27;
            border-color: #2d313e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .category-block { margin-bottom: 20px; }
        .category-block:last-child { margin-bottom: 0; }

        .category-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .category-title .dot {
            width: 4px; height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .category-title h3 { font-size: 15px; font-weight: 700; }
        .category-title .count { font-size: 12px; opacity: 0.5; }

        .tree-list {
            border-radius: 10px;
            border: 1px solid #f1f5f9;
            padding: 6px;
        }
        body.dark .tree-list {
            border-color: #2d313e;
            background: rgba(15, 17, 23, 0.5);
        }

        .tree-node { user-select: none; }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
        }
        .tree-row:hover { background: #f1f5f9; }
        body.dark .tree-row:hover { background: rgba(255, 255, 255, 0.05); }

        .tree-row .arrow {
            width: 14px; height: 14px;
            flex-shrink: 0;
            opacity: 0.5;
            transition: transform 0.2s;
        }
        .tree-row .arrow.expanded { transform: rotate(90deg); }
        .tree-row .arrow.placeholder { visibility: hidden; }

        .tree-row .icon { width: 16px; height: 16px; flex-shrink: 0; }
        .tree-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-row .count { font-size: 11px; opacity: 0.4; }
        .tree-row.hidden-item { opacity: 0.5; }
        .tree-row .hidden-mark { font-size: 11px; opacity: 0.5; }

        .children { overflow: hidden; }

        /* 加载 / 空状态 */
        .loading, .empty {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }
        .spinner {
            width: 36px; height: 36px;
            margin: 0 auto 12px;
            border: 3px solid #e2e8f0;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        body.dark .spinner { border-color: #2d313e; border-top-color: #818cf8; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div class="topbar">
        <h1>🪾 目录树</h1>
        <div class="actions">
            <a href="/" class="btn btn-primary">← 返回</a>
            <button class="btn btn-active" id="viewToggleBtn">📋 目录列表</button>
            <button class="btn" id="themeBtn">🌙</button>
        </div>
    </div>

    <!-- 思维导图视图 -->
    <div class="view-container" id="mindmapView">
        <svg id="mindmap"></svg>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载数据...</p>
        </div>
    </div>

    <!-- 树形列表视图 -->
    <div class="view-container hidden" id="treeView">
        <div id="treeview">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 全局数据
        // ============================================================
        let allSites = [];
        let allCategories = [];
        let allHiddenCategories = [];
        let categoryColorsMap = {};
        let markmapInstance = null;
        let currentView = 'mindmap'; // 'mindmap' | 'tree'
        let markmapRendered = false;
        let treeRendered = false;

        // ============================================================
        // 主题
        // ============================================================
        const themeBtn = document.getElementById('themeBtn');
        const savedTheme = localStorage.getItem('aurora_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function applyTheme(dark) {
            document.body.classList.toggle('dark', dark);
            themeBtn.textContent = dark ? '☀️' : '🌙';
            localStorage.setItem('aurora_theme', dark ? 'dark' : 'light');
            if (markmapRendered && allSites.length && currentView === 'mindmap') {
                renderMindmap();
            }
        }

        applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

        themeBtn.addEventListener('click', () => {
            applyTheme(!document.body.classList.contains('dark'));
        });

        // ============================================================
        // 视图切换
        // ============================================================
        const viewToggleBtn = document.getElementById('viewToggleBtn');
        const mindmapView = document.getElementById('mindmapView');
        const treeView = document.getElementById('treeView');
        const treeviewInner = document.getElementById('treeview');

        viewToggleBtn.addEventListener('click', () => {
            currentView = currentView === 'mindmap' ? 'tree' : 'mindmap';

            if (currentView === 'mindmap') {
                mindmapView.classList.remove('hidden');
                treeView.classList.add('hidden');
                viewToggleBtn.textContent = '📋 目录列表';
                if (!markmapRendered && allSites.length) renderMindmap();
            } else {
                mindmapView.classList.add('hidden');
                treeView.classList.remove('hidden');
                viewToggleBtn.textContent = '🌳 思维导图';
                if (!treeRendered && allSites.length) renderTreeView();
            }
        });

        // ============================================================
        // 图标 SVG
        // ============================================================
        const FOLDER_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
        const LINK_SVG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        // 过滤数据（按登录状态）
        // ============================================================
        function getFilteredData() {
            const isLoggedIn = localStorage.getItem('aurora_is_logged_in') === 'true';
            const sites = isLoggedIn ? allSites : allSites.filter(s => !s.isHidden);
            const categories = isLoggedIn
                ? allCategories
                : allCategories.filter(c => !allHiddenCategories.includes(c));
            return { sites, categories, isLoggedIn };
        }

        // ============================================================
        // 思维导图：生成 Markdown
        // ============================================================
        function buildMarkdown() {
            const { sites, categories } = getFilteredData();

            let md = '# 极光导航\n';

            categories.forEach(cat => {
                const rootNodes = sites
                    .filter(s => s.category === cat && !s.parentId)
                    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                if (rootNodes.length === 0) return;

                md += `## ${cat}\n`;

                function renderNode(node, indent) {
                    const isFolder = node.type === 'folder';
                    const children = sites
                        .filter(s => s.parentId === node.id)
                        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                    const prefix = ' '.repeat(indent) + '- ';
                    if (isFolder) {
                        md += `${prefix}📁 ${node.name}\n`;
                    } else {
                        // ✅ markdown 链接语法，节点显示干净
                        md += `${prefix}[🔗 ${node.name}](${node.url})\n`;
                    }

                    if (isFolder && children.length > 0) {
                        children.forEach(child => renderNode(child, indent + 2));
                    }
                }

                rootNodes.forEach(node => renderNode(node, 0));
            });

            return md;
        }

        // ============================================================
        // 思维导图：渲染
        // ============================================================
        function renderMindmap() {
            const svg = document.getElementById('mindmap');
            const { Markmap, Transformer } = window.markmap;

            const mdData = buildMarkdown();

            svg.innerHTML = '';

            const transformer = new Transformer();
            const { root } = transformer.transform(mdData);

            if (markmapInstance) {
                markmapInstance.destroy();
            }

            markmapInstance = Markmap.create(svg, {
                duration: 300,
                spacingHorizontal: 100,
                spacingVertical: 10,
                paddingX: 16,
                initialExpandLevel: -1,
                color: () => '#818cf8',
            }, root);

            markmapRendered = true;

            // ✅ 只给 <a> 设 target=_blank，阻止冒泡，不额外绑 window.open
            setTimeout(() => {
                svg.querySelectorAll('a').forEach(a => {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                    a.addEventListener('click', (e) => {
                        e.stopPropagation();
                    });
                });
            }, 400);
        }

        // ============================================================
        // 树形列表：渲染
        // ============================================================
        function renderNode(node, allSites, level) {
            const isFolder = node.type === 'folder';
            const children = allSites
                .filter(s => s.parentId === node.id)
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

            const hasChildren = isFolder && children.length > 0;
            const indent = level * 16;

            let html = '<div class="tree-node">';
            html += `<div class="tree-row ${node.isHidden ? 'hidden-item' : ''}" 
                        data-id="${node.id}" 
                        data-type="${node.type || 'site'}"
                        data-url="${escapeHtml(node.url || '')}"
                        data-folder="${isFolder ? '1' : '0'}"
                        style="padding-left: ${8 + indent}px">`;

            if (hasChildren) {
                html += `<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
            } else {
                html += `<span class="arrow placeholder"></span>`;
            }

            if (isFolder) {
                html += `<span style="color:${node.color || '#6366f1'}">${FOLDER_SVG}</span>`;
            } else {
                html += `<span style="color:${node.color || '#6366f1'}">${LINK_SVG}</span>`;
            }

            html += `<span class="name">${escapeHtml(node.name)}</span>`;

            if (node.isHidden) {
                html += `<span class="hidden-mark">👁️‍🗨️</span>`;
            }

            if (hasChildren) {
                html += `<span class="count">${children.length}</span>`;
            }

            html += '</div>';

            if (hasChildren) {
                html += `<div class="children" data-parent="${node.id}" style="display:none">`;
                children.forEach(child => {
                    html += renderNode(child, allSites, level + 1);
                });
                html += `</div>`;
            }

            html += '</div>';
            return html;
        }

        function renderTreeView() {
            const { sites, categories } = getFilteredData();
            const container = treeviewInner;

            if (!sites || sites.length === 0) {
                container.innerHTML = '<div class="empty">暂无数据</div>';
                return;
            }

            let html = '<div class="tree-wrap">';

            categories.forEach(cat => {
                const rootNodes = sites
                    .filter(s => s.category === cat && !s.parentId)
                    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

                if (rootNodes.length === 0) return;

                const catColor = categoryColorsMap[cat] || '#6366f1';

                html += '<div class="category-block">';
                html += `<div class="category-title">
                            <span class="dot" style="background:${catColor}"></span>
                            <h3>${escapeHtml(cat)}</h3>
                            <span class="count">(${rootNodes.length})</span>
                        </div>`;
                html += '<div class="tree-list">';
                rootNodes.forEach(node => {
                    html += renderNode(node, sites, 0);
                });
                html += '</div></div>';
            });

            html += '</div>';

            if (html === '<div class="tree-wrap"></div>') {
                html = '<div class="empty">暂无数据</div>';
            }

            container.innerHTML = html;

            container.querySelectorAll('.tree-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isFolder = row.dataset.folder === '1';
                    const url = row.dataset.url;
                    const id = row.dataset.id;

                    if (isFolder) {
                        const children = row.parentElement.querySelector(`.children[data-parent="${id}"]`);
                        const arrow = row.querySelector('.arrow');
                        if (children) {
                            const isOpen = children.style.display !== 'none';
                            children.style.display = isOpen ? 'none' : 'block';
                            if (arrow) arrow.classList.toggle('expanded', !isOpen);
                        }
                    } else if (url) {
                        window.open(url, '_blank');
                    }
                });
            });

            treeRendered = true;
        }

        // ============================================================
        // 获取数据
        // ============================================================
        async function init() {
            try {
                const res = await fetch('/api/init');
                if (!res.ok) throw new Error('API 请求失败');
                const data = await res.json();

                allCategories = (data.categories || []).map(c => c.name);
                allHiddenCategories = (data.categories || [])
                    .filter(c => c.isHidden)
                    .map(c => c.name);

                categoryColorsMap = {};
                (data.categories || []).forEach(c => {
                    if (c.color) categoryColorsMap[c.name] = c.color;
                });

                allSites = data.sites || [];

                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.style.display = 'none';

                renderMindmap();

            } catch (e) {
                console.error(e);
                const loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    loadingEl.innerHTML = '<p>⚠️ 加载失败：' + escapeHtml(e.message) + '</p>';
                }
            }
        }

        window.addEventListener('load', init);
    </script>

</body>
</html>
